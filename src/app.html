<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script type="module">
      import Typebot from 'https://cdn.jsdelivr.net/npm/@typebot.io/js@0/dist/web.js';

      window.Typebot = Typebot;
      const previewDismissed =
        localStorage.getItem('typebotPreviewDismissed') === 'true';
      window.typebotReady = Promise.resolve(
        Typebot.initBubble({
          typebot: 'tranquility-concierge-guukh4x',
          previewMessage: previewDismissed
            ? undefined
            : {
                message: 'Not sure what to choose?',
                autoShowDelay: 4000
              },
          onOpen: () => localStorage.setItem('typebotPreviewDismissed', 'true'),
          onPreviewMessageDismissed: () =>
            localStorage.setItem('typebotPreviewDismissed', 'true'),
          theme: {
            button: { backgroundColor: '#29172b', iconColor: '#f4f0eb' },
            previewMessage: {
              backgroundColor: '#f4f0eb',
              textColor: '#29172b'
            },
            chatWindow: { backgroundColor: '#f8f5f1', maxWidth: '440px' }
          }
        })
      );
    </script>
  </body>
</html>
